<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Imageye Extension</title>
    <meta name="description" content="Tell Imageye how we can improve.">
    <link rel="stylesheet" href="../../site.css">
    <script src="../../site.js" defer></script>
  </head>
  <body>
    <main class="uninstalled-page">
      <form class="uninstall-card" id="uninstall-feedback">
        <img src="../../assets/uninstall-logo.png" alt="imageye" class="uninstall-logo">
        <h1>We’re sad to see you go</h1>
        <div class="uninstall-feedback-field">
          <label for="uninstall-message">Let us know where we can improve</label>
          <textarea id="uninstall-message" placeholder="Type here"></textarea>
        </div>
        <button class="uninstall-send" type="submit" disabled>Send</button>
      </form>
    </main>
  </body>
</html>
