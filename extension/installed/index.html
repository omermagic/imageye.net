<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Imageye Extension</title>
    <meta name="description" content="Pin Imageye for easier access.">
    <link rel="stylesheet" href="../../site.css">
    <script src="../../site.js" defer></script>
  </head>
  <body>
    <main class="installed-page" id="onboarding">
      <div class="pin-guide" id="pin-guide" aria-hidden="true">
        <span class="pin-arrow">↗</span>
        <p>
          Click
          <svg class="puzzle" viewBox="0 0 19 19" aria-hidden="true">
            <path fill="currentColor" fill-rule="evenodd" clip-rule="evenodd" d="M15.55 8.185h-.76v-3.99a.76.76 0 0 0-.76-.76h-2.755C11.257 1.739 9.84.3 8.14.3 6.44.3 4.834 1.646 4.815 3.435H1.06a.76.76 0 0 0-.76.76v4.75a.76.76 0 0 0 .76.76h.615c.855 0 1.51.665 1.51 1.615 0 .855-.56 1.615-1.51 1.615H1.06a.76.76 0 0 0-.76.76v4.135c0 .475.38.76.76.76h12.875a.76.76 0 0 0 .76-.76v-3.375h.76c1.71 0 3.135-1.425 3.135-3.135.095-1.71-1.33-3.135-3.04-3.135Zm-.855 4.75h.855c.855 0 1.52-.76 1.52-1.615 0-.95-.76-1.615-1.615-1.615h-.76v3.23Zm-1.52-3.675V4.955H1.82v3.23h-.24c1.71 0 3.03 1.425 3.03 3.135s-1.32 3.135-3.03 3.135h.24v2.615h11.355V9.26ZM7.95 1.82c.94 0 1.6.682 1.615 1.615h-3.23C6.35 2.593 7.012 1.82 7.95 1.82Z"/>
          </svg>
          to pin Imageye
        </p>
      </div>

      <section class="onboarding-stage is-active" data-stage="1" aria-live="polite">
        <div class="welcome-card welcome-card--pin">
          <h1><strong>Pin Imageye</strong>, for easier access!</h1>
          <img src="../../assets/d5a7c93f171f92ac.gif" alt="How to pin Imageye in Chrome">
          <button class="done-button" data-next-stage="2" type="button">Done</button>
        </div>
      </section>

      <section class="onboarding-stage" data-stage="2" aria-live="polite">
        <div class="welcome-card welcome-card--celebrate">
          <h1>Welcome to Imageye!</h1>
          <button class="done-button" data-next-stage="3" type="button">Give a try</button>
        </div>
      </section>

      <section class="onboarding-stage" data-stage="3" aria-live="polite">
        <div class="try-gallery">
          <img src="../../assets/onboarding_1.jpg" alt="Welcome sign on a country road">
          <img src="../../assets/onboarding_2.jpg" alt="Illuminated number two">
          <img src="../../assets/onboarding_3.jpg" alt="Image sign in a city">
          <img src="../../assets/onboarding_4.jpg" alt="Stylized eye illustration">
        </div>
        <button class="done-button try-start" data-finish-onboarding type="button">Let's start</button>
      </section>
    </main>
  </body>
</html>
